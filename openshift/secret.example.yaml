# PARA ESTE CASO SE Aplican desde git los valores, pero se deben de intyectar desde consola.
# Créalos con la CLI (ver README):
#   oc create secret generic pedidos-api-secrets \
#       --from-literal=MONGODB_URI='mongodb://mongodb-vm-service:27017/pedidos?authSource=admin' \
#       --from-literal=ADMIN_EMAIL='jcastillo.brandon@gmail.com' \
#       --from-literal=ADMIN_PASSWORD='Admin123!'
#   oc create secret generic pedidos-api-jwt-keys \
#       --from-file=privateKey.pem=./secrets/privateKey.pem \
#       --from-file=publicKey.pem=./secrets/publicKey.pem
apiVersion: v1
kind: Secret
metadata:
  name: pedidos-api-secrets
type: Opaque
stringData:
  MONGODB_URI: mongodb://mongodb-vm-service:27017/pedidos?authSource=admin
  ADMIN_EMAIL: admin@pedidos.local
  ADMIN_PASSWORD: Admin123!
