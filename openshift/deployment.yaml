apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos-api
  labels:
    app: pedidos-api
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"pedidos-api:latest"},
        "fieldPath":"spec.template.spec.containers[?(@.name==\"pedidos-api\")].image"}]
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pedidos-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: pedidos-api
    spec:
      containers:
        - name: pedidos-api
          image: pedidos-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pedidos-api-config
            - secretRef:
                name: pedidos-api-secrets
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/jwt
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: jwt-keys
          secret:
            secretName: pedidos-api-jwt-keys
            defaultMode: 0440
