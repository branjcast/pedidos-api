quarkus.application.name=pedidos-api
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:*}
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.test.continuous-testing=disabled

# ---- MongoDB ----
quarkus.mongodb.database=${MONGODB_DATABASE:pedidos}
%prod.quarkus.mongodb.connection-string=${MONGODB_URI}

# ---- JWT ----
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_PATH:dev-keys/publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_PATH:dev-keys/privateKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://pedidos-api}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ---- Administrador inicial (si se reuieren) ----
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
%dev.app.admin.email=admin@pedidos.local
%dev.app.admin.password=Admin123!
%test.app.admin.email=admin@pedidos.local
%test.app.admin.password=Admin123!

# ---- OpenAPI / Swagger UI ----
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.persist-authorization=true

# ---- Logs ----
quarkus.log.level=INFO
quarkus.log.category."com.pedidos".level=DEBUG
%prod.quarkus.log.category."com.pedidos".level=INFO

# ---- Seguridad----
quarkus.security.jaxrs.deny-unannotated-endpoints=true
